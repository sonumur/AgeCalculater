<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online BMI calculator. Calculate your Body Mass Index instantly. Check if you are underweight, normal weight, overweight, or obese.">
    <meta name="keywords" content="bmi calculator, bmi calculator online, body mass index calculator, health calculator">
    <title>BMI Calculator – Calculate Your Body Mass Index Online</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">

<body>
    <header>
        <img src="../images/pepstudio.png">
        <div class="icon">
            <a href="https://www.linkedin.com/in/sonu-murmu-60479a268/">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="https://www.instagram.com/sonu_murm_/">
                <i class="bi bi-instagram"></i>
            </a>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="card-box">
                <h2>
                    <u>BMI Calculator</u>
                </h2>
                <p>Calculate your Body Mass Index (BMI) instantly. Get personalized health insights and recommendations based on your BMI results.</p>
            </div>
        
            <section class="card-calculater">
                <h1>BMI Calculator</h1>
                <form id="bmiForm">
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" placeholder="Enter height in cm" step="0.1" required>
                    
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" placeholder="Enter weight in kg" step="0.1" required>
                    
                    <button type="submit">Calculate BMI</button>
                </form>
            </section> 
        </div> 
    </main>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalResult"></div>
        </div>
    </div>
