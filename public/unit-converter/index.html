<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online unit converter. Convert between different units of measurement instantly. Length, weight, temperature, and more.">
    <meta name="keywords" content="unit converter, online converter, measurement converter, length converter, weight converter, temperature converter">
    <title>Unit Converter – Convert Units Online</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../images/favicon.svg">
</head>
<body>
    <header>
        <img src="../images/pepstudio.png">
        <div class="icon">
            <a href="https://www.linkedin.com/in/sonu-murmu-60479a268/">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="https://www.instagram.com/sonu_murm_/">
                <i class="bi bi-instagram"></i>
            </a>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="card-box">
                <h2>
                    <u>Unit Converter</u>
                </h2>
                <p>Convert between various units of measurement instantly. Supports length, weight, temperature, volume, and more.</p>
            </div>
        
            <section class="card-calculater">
                <h1>Unit Converter</h1>
                <form id="converterForm">
                    <label for="value">Value:</label>
                    <input type="number" id="value" name="value" placeholder="Enter value to convert" step="any" required>
                    
                    <label for="fromUnit">From:</label>
                    <input type="text" id="fromUnit" name="fromUnit" placeholder="e.g., meters, km, miles" required>
                    
                    <label for="toUnit">To:</label>
                    <input type="text" id="toUnit" name="toUnit" placeholder="e.g., feet, inches, km" required>
                    
                    <button type="submit">Convert</button>
                </form>
            </section> 
        </div> 
    </main>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalResult"></div>
        </div>
    </div>

    <footer>
        
        <a href="../about-us.html">About Us</a>

    <script src="../js/unit-converter.js"></script>
</body>
</html>
