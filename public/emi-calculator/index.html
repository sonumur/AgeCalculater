<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online EMI calculator. Calculate your monthly EMI instantly with our easy-to-use EMI calculator.">
    <meta name="keywords" content="emi calculator, emi calculator online, loan emi calculator, home loan emi calculator, car emi calculator">
    <title>EMI Calculator – Calculate Monthly EMI Online</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../images/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .emi-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .emi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }
        .emi-inputs {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .emi-results {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            margin-bottom: 30px;
        }
        .input-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: block;
        }
        .slider-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .slider-input {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.4);
        }
        .slider-input::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.4);
        }
        .value-display {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 5px;
            min-width: 100px;
            text-align: center;
            font-weight: bold;
            color: #007bff;
        }
        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        .result-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 30px;
        }
        @media (max-width: 768px) {
            .emi-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .result-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="../images/pepstudio.png">
        <div class="icon">
            <a href="https://www.linkedin.com/in/sonu-murmu-60479a268/">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="https://www.instagram.com/sonu_murm_/">
                <i class="bi bi-instagram"></i>
            </a>
        </div>
    </header>
    <main>
        <div class="emi-container">
            <h1 style="text-align: center; color: #007bff; margin-bottom: 40px;">EMI Calculator</h1>
            
            <div class="emi-grid">
                <div class="emi-inputs">
                    <h2 style="color: #007bff; margin-top: 0;">Loan Details</h2>
                    
                    <div class="input-group">
                        <label class="input-label">Loan Amount</label>
                        <div class="slider-wrapper">
                            <input type="range" id="principal" class="slider-input" min="100000" max="10000000" step="10000" value="2500000">
                            <div class="value-display" id="principalDisplay">₹ 25,00,000</div>
                        </div>
                        <div class="range-labels">
                            <span>₹ 1 Lac</span>
                            <span>₹ 10 Cr</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Tenure (Years)</label>
                        <div class="slider-wrapper">
                            <input type="range" id="tenure" class="slider-input" min="1" max="30" step="1" value="20">
                            <div class="value-display" id="tenureDisplay">20</div>
                        </div>
                        <div class="range-labels">
                            <span>1</span>
                            <span>30</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Interest Rate (% P.A.)</label>
                        <div class="slider-wrapper">
                            <input type="range" id="rate" class="slider-input" min="0.5" max="15" step="0.1" value="7.75">
                            <div class="value-display" id="rateDisplay">7.75 %</div>
                        </div>
                        <div class="range-labels">
                            <span>0.5%</span>
                            <span>15%</span>
                        </div>
                    </div>
                </div>

                <div class="emi-results">
                    <h2 style="color: #007bff; margin-top: 0;">Loan Breakdown</h2>
                    
                    <div class="result-item">
                        <div class="result-label">Monthly EMI</div>
                        <div class="result-value" id="emiResult">₹ 17,910</div>
                    </div>

                    <div class="result-item">
                        <div class="result-label">Principal Amount</div>
                        <div class="result-value" id="principalResult">₹ 25,00,000</div>
                    </div>

                    <div class="result-item">
                        <div class="result-label">Interest Amount</div>
                        <div class="result-value" id="interestResult">₹ 0</div>
                    </div>

                    <div class="result-item">
                        <div class="result-label">Total Amount Payable</div>
                        <div class="result-value" id="totalResult">₹ 0</div>
                    </div>

                    <div class="chart-container">
                        <canvas id="emiChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="../about-us.html">About Us</a>
        <a href="../contact-us.html">Contact Us</a>
        <a href="../privacy-policy.html">Privacy Policy</a>
        <a href="../terms-of-service.html">Terms of Service</a>
        <a href="../dmca.html">DMCA</a>
        <br>
        <span>&copy; 2026 pepstudio ❤️. All rights reserved.</span>
    </footer>

    <script src="../js/emi-calculator.js"></script>
</body>
</html>
