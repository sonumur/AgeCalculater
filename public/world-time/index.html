        .time-slider::-moz-range-thumb {

            border-radius: 50%;

            cursor: pointer;

            border: 2px solid white;

<body style="background: #f8f9ff !important; background-image: none !important;">

    <main class="world-time-page flex-grow w-full antialiased" style="background: #f8f9ff !important; background-image: none !important;">
        <div class="world-time-shell flex flex-col gap-8">
            <!-- Hero Section -->
            <section class="flex flex-col items-center text-center space-y-4 pt-4 pb-6">
                <h1 class="font-display-lg text-display-lg text-primary tracking-tight">World Time</h1>
                <p class="font-body-lg text-body-lg text-secondary max-w-2xl">Coordinate global meetings and track time across different zones with absolute precision.</p>
                
                <!-- Local Time Banner Card -->
                <div class="bg-surface-container-lowest shadow-[0_4px_20px_rgba(15,23,42,0.04)] hover:shadow-[0_8px_30px_rgba(15,23,42,0.08)] transition-shadow duration-300 rounded-[16px] p-8 md:p-10 w-full max-w-3xl mt-6 relative overflow-hidden border border-outline-variant/30">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-surface-container-high rounded-full blur-3xl opacity-50 -mr-20 -mt-20"></div>
                    <div class="relative z-10 flex flex-col md:flex-row justify-between items-center md:items-end gap-6">
                        <div class="text-left flex flex-col gap-2">
                            <span class="font-label-sm text-label-sm text-primary uppercase tracking-wider font-semibold flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary text-[18px]">location_on</span>
                                <span id="localTimezone">Local Time</span>
                            </span>
                            <h2 class="font-headline-lg text-headline-lg md:text-[56px] leading-none font-bold text-on-background tracking-tighter" id="localTimeDisplay">10:42:00 AM</h2>
                            <p class="font-body-lg text-body-lg text-secondary mt-2" id="localDateDisplay">Wednesday, Oct 25</p>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="bg-surface-blue px-4 py-2 rounded-lg border border-primary-fixed flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-success-green animate-pulse"></span>
                                <span class="font-label-sm text-label-sm text-on-surface-variant">Live Sync Active</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Search & Controls Section -->
            <section class="flex flex-col md:flex-row justify-between items-center gap-6 bg-surface-container-lowest p-6 rounded-[16px] shadow-[0_4px_20px_rgba(15,23,42,0.04)] border border-outline-variant/30">
                <div class="relative w-full md:w-96">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-secondary">search</span>
                    <input id="searchTimezone" class="w-full pl-12 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-on-surface" placeholder="Search city or timezone..." type="text"/>
                </div>
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <span class="font-label-sm text-label-sm text-secondary whitespace-nowrap" id="sliderLabel">Compare Offset: +0h</span>
                    <div class="flex-grow md:w-64 flex items-center">
                        <input id="timeSlider" class="time-slider" max="12" min="-12" type="range" value="0"/>
                    </div>
                    <button id="resetSliderBtn" class="font-label-sm text-label-sm bg-surface-blue text-primary border border-primary/20 px-4 py-2 rounded-lg hover:bg-primary-container hover:text-on-primary transition-colors">Reset</button>
                </div>
            </section>

            <!-- Time Zone Cards Grid -->
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="timezoneGrid">
                <!-- Cities generated dynamically by JS -->
            </section>
