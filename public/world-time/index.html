    <meta name="description" content="Free online world time converter. Check current time in different time zones across the world. Fast, accurate, and easy to use.">
    <meta name="keywords" content="world time, time zone converter, current time, international time, time zone, clock, world clock">
    <title>World Time – Check Current Time in Different Time Zones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-size: 40px;
            font-weight: bold;
            color: #007bff;
        }

        .world-time-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .card-box {
            /* text-align: center; Removed from here, moved to style.css */
        }
        
        .timezone-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .timezone-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .timezone-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .timezone-card .time {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }
        
        .timezone-card .date {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .timezone-card .offset {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .search-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .search-section input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-section input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .current-time-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .current-time-banner .local-time {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
        }
        
        .current-time-banner .local-timezone {
            font-size: 18px;
            opacity: 0.9;
        }
    </style>
</head>

                <p>Instantly check the current time in major cities and time zones around the world. Perfect for scheduling international meetings and staying connected globally.</p>
            </div>
        
            <section class="world-time-container">
                <div class="current-time-banner">
                    <div class="local-timezone" id="localTimezone">Your Local Time</div>
                    <div class="local-time" id="localTime">--:--:--</div>
                    <div class="current-time-banner" style="background: rgba(255,255,255,0.1); margin-top: 15px; padding: 15px;">
                        <div id="localDate" style="font-size: 14px;"></div>
                    </div>
                </div>
                
                <div class="search-section">
                    <input type="text" id="searchTimezone" placeholder="Search for a city or timezone...">
                </div>
                
                <div class="timezone-grid" id="timezoneGrid">
                    <!-- Timezone cards will be populated by JavaScript -->
                </div>
